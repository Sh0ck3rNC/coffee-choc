<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Admin — Commandes</title>
</head>
<body>
<main>
    <div class="mb-4">
        <div class="page-eyebrow">Administration</div>
        <h2 class="page-title mb-0">Gestion des Commandes</h2>
        <div class="ornament">
            <div class="ornament-line"></div>
            <div class="ornament-dot"></div>
            <div class="ornament-line rev"></div>
        </div>
    </div>

    <div class="panel">
        <table class="table table-jazz align-middle mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Client</th>
                <th>Email</th>
                <th>Date</th>
                <th>Total</th>
                <th>Statut</th>
                <th>Changer statut</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${commandes}">
                <td style="font-size:0.8rem;color:var(--smoke)" th:text="${c.id}"></td>
                <td style="font-family:'Playfair Display',serif;font-weight:600;color:var(--roast)" th:text="${c.nomClient}"></td>
                <td style="font-size:0.83rem" th:text="${c.emailClient}"></td>
                <td style="font-size:0.83rem" th:text="${#temporals.format(c.dateCommande, 'dd/MM/yyyy HH:mm')}"></td>
                <td style="font-family:'Playfair Display',serif;font-weight:600" th:text="${#numbers.formatDecimal(c.total, 1, 0)} + ' XPF'"></td>
                <td>
                    <span style="font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;border-radius:2px;padding:0.25em 0.65em;border:1px solid"
                          th:classappend="${c.statut.name() == 'EN_ATTENTE'} ? 'text-warning border-warning' :
                                          (${c.statut.name() == 'EN_PREPARATION'} ? 'text-info border-info' :
                                          (${c.statut.name() == 'PRET'} ? '' :
                                          (${c.statut.name() == 'LIVRE'} ? '' : 'text-danger border-danger')))"
                          th:style="${c.statut.name() == 'PRET'} ? 'color:var(--caramel);border-color:var(--caramel)' :
                                     (${c.statut.name() == 'LIVRE'} ? 'color:#4a7c59;border-color:#4a7c59' : '')"
                          th:text="${c.statut}">
                    </span>
                </td>
                <td>
                    <form th:action="@{/admin/commandes/{id}/statut(id=${c.id})}" method="post"
                          class="d-flex gap-1">
                        <select name="statut" class="form-select form-select-sm" style="width:auto;font-size:0.8rem">
                            <option th:each="s : ${statuts}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${s == c.statut}">
                            </option>
                        </select>
                        <button type="submit" class="btn btn-cafe btn-sm" style="font-size:0.68rem;padding:0.3rem 0.75rem">OK</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(commandes)}" class="empty-state">
            <i class="bi bi-inbox"></i>
            <p>Aucune commande pour le moment.</p>
        </div>
    </div>
</main>
</body>
</html>
