<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Admin — Modifier Produit</title>
</head>
<body>
<main>
    <h2 class="fw-bold mb-4" style="color:#3b1f0e">
        <i class="bi bi-pencil-square me-2"></i>Modifier le produit
    </h2>

    <div class="card p-4" style="max-width:600px">
        <form th:action="@{/admin/produits/edit/{id}(id=${produit.id})}"
              th:object="${produit}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nom</label>
                <input type="text" th:field="*{nom}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Catégorie</label>
                <input type="text" th:field="*{categorie}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Prix (XPF)</label>
                <input type="number" th:field="*{prix}" class="form-control" step="0.01" required/>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">URL Image</label>
                <input type="text" th:field="*{imageUrl}" class="form-control"/>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{disponible}" class="form-check-input" id="disponible"/>
                <label class="form-check-label" for="disponible">Disponible</label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-cafe">
                    <i class="bi bi-save me-1"></i>Sauvegarder
                </button>
                <a th:href="@{/admin/produits}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
