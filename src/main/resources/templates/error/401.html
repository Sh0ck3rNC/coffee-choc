<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>401 — Accès refusé</title></head>
<body>
<main>
    <div class="text-center py-5">
        <i class="bi bi-shield-x fs-1" style="color:#d4a96a"></i>
        <h1 class="fw-bold mt-3" style="color:#3b1f0e">401</h1>
        <p class="text-muted fs-5">Accès non autorisé.</p>
        <p class="text-muted" th:if="${message}" th:text="${message}"></p>
        <a th:href="@{/admin/login}" class="btn btn-cafe mt-3">
            <i class="bi bi-box-arrow-in-right me-1"></i>Se connecter
        </a>
    </div>
</main>
</body>
</html>
