<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>500 — Erreur serveur</title></head>
<body>
<main>
    <div class="text-center py-5">
        <i class="bi bi-exclamation-triangle fs-1" style="color:#d4a96a"></i>
        <h1 class="fw-bold mt-3" style="color:#3b1f0e">500</h1>
        <p class="text-muted fs-5">Une erreur serveur est survenue.</p>
        <p class="text-muted" th:if="${message}" th:text="${message}"></p>
        <a th:href="@{/}" class="btn btn-cafe mt-3">
            <i class="bi bi-house me-1"></i>Retour au menu
        </a>
    </div>
</main>
</body>
</html>
