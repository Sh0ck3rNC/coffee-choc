<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Coffee Choc — Panier</title>
</head>
<body>
<main>
    <h2 class="fw-bold mb-4" style="color:#3b1f0e">
        <i class="bi bi-cart3 me-2"></i>Mon Panier
    </h2>

    <div id="panier-vide" class="text-center py-5 text-muted">
        <i class="bi bi-cart-x fs-1"></i>
        <p class="mt-2">Votre panier est vide.</p>
        <a th:href="@{/}" class="btn btn-cafe mt-2">Voir le menu</a>
    </div>

    <div id="panier-contenu" class="d-none">
        <table class="table bg-white rounded shadow-sm">
            <thead style="background-color:#3b1f0e; color:white;">
            <tr>
                <th>Produit</th>
                <th>Prix unitaire</th>
                <th>Quantité</th>
                <th>Sous-total</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="lignes-panier"></tbody>
        </table>

        <div class="card p-4 mt-3">
            <h4 class="fw-bold mb-3" style="color:#3b1f0e">Passer la commande</h4>
            <div class="mb-3">
                <label class="form-label fw-semibold">Nom complet</label>
                <input type="text" id="nomClient" class="form-control" placeholder="Ex: Jean Dupont"/>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" id="emailClient" class="form-control" placeholder="Ex: jean@email.com"/>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="fw-bold">Total : <span id="total">0</span> XPF</h5>
                <button class="btn btn-cafe px-4" onclick="passerCommande()">
                    <i class="bi bi-check-circle me-1"></i>Commander
                </button>
            </div>
        </div>
    </div>

    <script>
        let panier = JSON.parse(localStorage.getItem('panier') || '[]');

        function afficherPanier() {
            const tbody = document.getElementById('lignes-panier');
            const totalEl = document.getElementById('total');
            const panierVide = document.getElementById('panier-vide');
            const panierContenu = document.getElementById('panier-contenu');

            tbody.innerHTML = '';
            let total = 0;

            if (panier.length === 0) {
                panierVide.classList.remove('d-none');
                panierContenu.classList.add('d-none');
                return;
            }

            panierVide.classList.add('d-none');
            panierContenu.classList.remove('d-none');

            panier.forEach((item, index) => {
                const sousTotal = item.prix * item.quantite;
                total += sousTotal;
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-semibold">${item.nom}</td>
                        <td>${item.prix} XPF</td>
                        <td>
                            <div class="input-group input-group-sm" style="width:110px">
                                <button class="btn btn-outline-secondary" onclick="changerQte(${index}, -1)">-</button>
                                <span class="input-group-text">${item.quantite}</span>
                                <button class="btn btn-outline-secondary" onclick="changerQte(${index}, 1)">+</button>
                            </div>
                        </td>
                        <td>${sousTotal} XPF</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger" onclick="supprimer(${index})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>`;
            });
            totalEl.textContent = total;
        }

        function changerQte(index, delta) {
            panier[index].quantite += delta;
            if (panier[index].quantite <= 0) panier.splice(index, 1);
            localStorage.setItem('panier', JSON.stringify(panier));
            afficherPanier();
        }

        function supprimer(index) {
            panier.splice(index, 1);
            localStorage.setItem('panier', JSON.stringify(panier));
            afficherPanier();
        }

        async function passerCommande() {
            const nom = document.getElementById('nomClient').value.trim();
            const email = document.getElementById('emailClient').value.trim();
            if (!nom || !email) { alert('Veuillez renseigner votre nom et email.'); return; }
            if (panier.length === 0) { alert('Votre panier est vide.'); return; }

            const panierObj = {};
            panier.forEach(item => panierObj[item.id] = item.quantite);

            const response = await fetch('/api/commandes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nomClient: nom, emailClient: email, panier: panierObj })
            });

            if (response.ok) {
                localStorage.removeItem('panier');
                alert('Commande passée avec succès ! Merci ' + nom + ' ☕');
                window.location.href = '/';
            } else {
                alert('Erreur lors de la commande, veuillez réessayer.');
            }
        }

        afficherPanier();
    </script>
</main>
</body>
</html>
