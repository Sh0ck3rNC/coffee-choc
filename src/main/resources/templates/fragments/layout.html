<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">Coffee Choc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background-color: #f8f4ef; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #3b1f0e !important; }
        .navbar-brand, .nav-link { color: #f5e6d3 !important; }
        .nav-link:hover { color: #d4a96a !important; }
        .btn-cafe { background-color: #6f3d1f; color: white; border: none; }
        .btn-cafe:hover { background-color: #3b1f0e; color: white; }
        .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .card-img-top { border-radius: 16px 16px 0 0; object-fit: cover; height: 180px; }
        .badge-categorie { background-color: #d4a96a; color: #3b1f0e; font-weight: 600; }
        .footer { background-color: #3b1f0e; color: #f5e6d3; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
            <i class="bi bi-cup-hot-fill me-2"></i>Coffee Choc
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i>Menu</a>
            <a class="nav-link" th:href="@{/panier}"><i class="bi bi-cart me-1"></i>Panier</a>
            <a class="nav-link" th:href="@{/admin/produits}"><i class="bi bi-gear me-1"></i>Admin</a>
        </div>
    </div>
</nav>

<main class="container py-4" th:replace="${content}">
</main>

<footer class="footer text-center py-3 mt-5">
    <small>&copy; 2026 Coffee Choc — MIAGE UNC</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/panier.js}"></script>
</body>
</html>
