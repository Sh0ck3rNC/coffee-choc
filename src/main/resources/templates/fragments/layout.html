<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">Coffee Choc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --espresso:  #1e0f07;
            --roast:     #3b1f0e;
            --mahogany:  #5c2d13;
            --caramel:   #b5773a;
            --gold:      #d4a96a;
            --cream:     #f5e6d3;
            --parchment: #faf4ec;
            --fog:       #e8ddd0;
            --smoke:     #c9b99d;
        }

        body {
            background-color: var(--parchment);
            font-family: 'DM Sans', sans-serif;
            color: var(--espresso);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--espresso) !important;
            border-bottom: 1px solid rgba(212,169,106,0.25);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.45rem;
            color: var(--cream) !important;
            letter-spacing: 0.03em;
        }

        .navbar-brand .brand-amp {
            color: var(--gold);
            font-style: italic;
            margin: 0 0.15em;
        }

        .nav-link {
            color: var(--smoke) !important;
            font-size: 0.75rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            font-weight: 400;
            padding: 0.4rem 1rem !important;
            transition: color 0.2s;
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 1rem; right: 1rem;
            height: 1px;
            background: var(--gold);
            transform: scaleX(0);
            transition: transform 0.2s;
        }

        .nav-link:hover { color: var(--gold) !important; }
        .nav-link:hover::after { transform: scaleX(1); }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            font-weight: 600;
            color: var(--roast);
        }

        .page-eyebrow {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.95rem;
            color: var(--caramel);
            letter-spacing: 0.08em;
        }

        .ornament {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0.5rem 0 2rem;
        }
        .ornament-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--gold), transparent);
        }
        .ornament-line.rev { background: linear-gradient(90deg, transparent, var(--gold)); }
        .ornament-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }

        .card {
            border: 1px solid var(--fog);
            border-radius: 3px;
            box-shadow: 0 2px 16px rgba(30,15,7,0.06);
            background: #fffdf9;
            transition: box-shadow 0.3s, transform 0.3s;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: 0 8px 28px rgba(30,15,7,0.13);
            transform: translateY(-3px);
        }

        .card-img-top {
            object-fit: cover;
            height: 195px;
            filter: sepia(8%) saturate(88%);
            transition: filter 0.35s;
        }

        .card:hover .card-img-top { filter: sepia(0%) saturate(100%); }

        .card-body { padding: 1.25rem; }

        .badge-categorie {
            background: transparent;
            border: 1px solid var(--caramel);
            color: var(--caramel);
            font-size: 0.62rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            border-radius: 2px;
            padding: 0.22em 0.6em;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--roast);
            margin-top: 0.3rem;
            margin-bottom: 0.3rem;
        }

        .card-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            color: var(--mahogany);
            line-height: 1.5;
        }

        .prix-display {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--mahogany);
        }

        .btn-cafe {
            background-color: var(--roast);
            color: var(--cream);
            border: 1px solid var(--roast);
            border-radius: 2px;
            font-size: 0.73rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 500;
            padding: 0.5rem 1.1rem;
            transition: all 0.22s;
        }

        .btn-cafe:hover {
            background: transparent;
            color: var(--roast);
            border-color: var(--roast);
        }

        .form-control, .form-select {
            border: 1px solid var(--fog);
            border-radius: 2px;
            background: var(--parchment);
            color: var(--espresso);
            font-size: 0.88rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--caramel);
            box-shadow: 0 0 0 2px rgba(181,119,58,0.14);
            background: #fff;
        }

        .form-label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--mahogany);
            font-weight: 500;
            margin-bottom: 0.35rem;
        }

        .panel {
            background: #fffdf9;
            border: 1px solid var(--fog);
            border-radius: 3px;
            padding: 1.75rem;
        }

        .table-jazz thead th {
            background-color: var(--espresso);
            color: var(--cream);
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 400;
            border: none;
            padding: 0.9rem 0.75rem;
        }

        .table-jazz tbody tr { border-bottom: 1px solid var(--fog); }
        .table-jazz tbody tr:hover { background: rgba(212,169,106,0.05); }

        footer {
            background-color: var(--espresso);
            color: var(--smoke);
        }

        footer::before {
            content: '';
            display: block;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .footer-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            font-style: italic;
            color: var(--cream);
        }

        .footer-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--caramel);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
        }

        .footer-note {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            opacity: 0.5;
        }

        #toastAjout {
            background-color: var(--espresso) !important;
            border: 1px solid var(--caramel) !important;
            color: var(--cream) !important;
            border-radius: 2px !important;
            font-size: 0.85rem;
        }

        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--smoke); }
        .empty-state i { font-size: 2.2rem; color: var(--caramel); opacity: 0.45; }
        .empty-state p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.05rem;
            margin-top: 0.75rem;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.42s ease both; }
        .col:nth-child(1) .card { animation-delay: 0.00s; }
        .col:nth-child(2) .card { animation-delay: 0.07s; }
        .col:nth-child(3) .card { animation-delay: 0.14s; }
        .col:nth-child(4) .card { animation-delay: 0.21s; }
        .col:nth-child(5) .card { animation-delay: 0.28s; }
        .col:nth-child(6) .card { animation-delay: 0.35s; }

        main.container {
            padding-top: 3rem !important;
            padding-bottom: 3rem !important;
            margin-top: 1.5rem !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-cup-hot-fill me-1" style="color:var(--gold)"></i>Coffee<span class="brand-amp">&amp;</span>Choc
        </a>
        <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
            <a class="nav-link" th:href="@{/}">Menu</a>
            <a class="nav-link" th:href="@{/panier}"><i class="bi bi-bag me-1"></i>Panier</a>
            <a class="nav-link" th:href="@{/admin/produits}">Admin</a>

            <!-- Indicateur connecté -->
            <span th:if="${adminConnecte}" class="ms-3 d-flex align-items-center gap-2">
                <span class="badge bg-success">
                    <i class="bi bi-shield-check me-1"></i>Admin connecté
                </span>
                <a th:href="@{/admin/logout}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </span>

            <!-- Indicateur non connecté -->
            <span th:unless="${adminConnecte}" class="ms-3">
                <span class="badge bg-secondary">
                    <i class="bi bi-shield-x me-1"></i>Non connecté
                </span>
            </span>
        </div>
    </div>
</nav>

<div class="container px-4" style="padding-top:2rem; flex: 1;">
    <main th:replace="${content}">
    </main>
</div>

<footer class="py-5 mt-5">
    <div class="container text-center">
        <div class="footer-brand mb-1">Coffee &amp; Choc</div>
        <div class="footer-tagline mb-3">Nouméa · Café de caractère</div>
        <div class="footer-note">&copy; 2026 Coffee Choc — MIAGE UNC</div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/panier.js}"></script>
</body>
</html>
